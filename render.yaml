services:
  - type: web
    name: tv-channel-server
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCHEDULE_SOURCE_URL
        sync: false
      - key: SCHEDULE_REFRESH_SECONDS
        value: "60"
      - key: STREAM_WIDTH
        value: "640"
      - key: STREAM_HEIGHT
        value: "360"
      - key: STREAM_FPS
        value: "20"
      - key: STREAM_THREADS
        value: "2"
      - key: STREAM_PRESET
        value: ultrafast
      - key: VIDEO_BITRATE
        value: 600k
      - key: AUDIO_BITRATE
        value: 64k
