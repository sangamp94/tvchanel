services:
  - type: web
    name: tv-channel-server
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCHEDULE_SOURCE_URL
        sync: false
      - key: SCHEDULE_REFRESH_SECONDS
        value: "60"
      - key: STREAM_WIDTH
        value: "1280"
      - key: STREAM_HEIGHT
        value: "720"
      - key: STREAM_PRESET
        value: veryfast
      - key: VIDEO_BITRATE
        value: 1500k
      - key: AUDIO_BITRATE
        value: 128k
