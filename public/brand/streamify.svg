<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Streamify TV</title><desc id="desc">Neon pink and red television play logo with Streamify TV wordmark.</desc>
