<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">MAHHA TV</title><desc id="desc">Glossy crimson circular C-shaped channel emblem with chrome MAHHA lettering and TV badge.</desc>
<defs>
 <linearGradient id="red" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ff7777"/><stop offset=".12" stop-color="#ff1515"/><stop offset=".48" stop-color="#e90000"/><stop offset=".72" stop-color="#ff2727"/><stop offset="1" stop-color="#790000"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".15" stop-color="#ffb0b0"/><stop offset=".32" stop-color="#ff1515"/><stop offset=".55" stop-color="#7c0000"/><stop offset=".8" stop-color="#ff3d3d"/><stop offset="1" stop-color="#310000"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset=".22" stop-color="#e5e7eb"/><stop offset=".45" stop-color="#fff"/><stop offset=".68" stop-color="#9ca3af"/><stop offset=".83" stop-color="#fff"/><stop offset="1" stop-color="#aeb4bf"/></linearGradient>
 <linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#210d10"/><stop offset=".55" stop-color="#050305"/><stop offset="1" stop-color="#3d080c"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
 <path id="topArc" d="M 125,600 A 475,475 0 0,1 1045,355"/>
</defs>
<rect width="1200" height="1200" fill="#000"/>
<g filter="url(#glow)">
 <!-- Extruded circular C body -->
 <path d="M1040 300 A490 490 0 1 0 1050 900 L960 805 A360 360 0 1 1 945 400Z" fill="#510000" stroke="#290000" stroke-width="22" transform="translate(0 18)"/>
 <path d="M1040 290 A490 490 0 1 0 1050 890 L960 795 A360 360 0 1 1 945 390Z" fill="url(#red)" stroke="url(#edge)" stroke-width="13"/>
 <path d="M1020 300 A470 470 0 1 0 1030 875" fill="none" stroke="#ff6b6b" stroke-width="5" opacity=".9"/>
 <path d="M1000 330 A430 430 0 1 0 1000 845" fill="none" stroke="#790000" stroke-width="18" opacity=".75"/>
 <!-- Bright curved highlight -->
 <path d="M400 150 C600 80 825 140 950 255" fill="none" stroke="#fff" stroke-width="10" opacity=".8"/>
 <path d="M130 760 C175 970 380 1090 575 1070" fill="none" stroke="#ffaaaa" stroke-width="7" opacity=".8"/>
 <!-- Inner C cutout -->
 <path d="M895 370 A350 350 0 1 0 900 800" fill="none" stroke="#ff5353" stroke-width="10"/>
 <!-- TV black plaque -->
 <path d="M720 430 Q720 400 760 385 L1045 300 Q1090 290 1110 330 L1170 600 Q1180 640 1140 660 L845 740 Q805 748 790 710Z" fill="#390000" stroke="#ff1616" stroke-width="20" transform="translate(-8 15)"/>
 <path d="M710 420 Q710 390 750 375 L1035 290 Q1080 280 1100 320 L1160 590 Q1170 630 1130 650 L835 730 Q795 738 780 700Z" fill="url(#black)" stroke="url(#edge)" stroke-width="12"/>
 <path d="M732 421 L1040 324 Q1070 315 1080 345" fill="none" stroke="#ffb5b5" stroke-width="5"/>
 <!-- Silver TV lettering -->
 <text x="800" y="555" font-family="Arial,Helvetica,sans-serif" font-size="185" font-weight="900" font-style="italic" fill="#500000" stroke="#120000" stroke-width="15" transform="translate(7 15)">TV</text>
 <text x="800" y="555" font-family="Arial,Helvetica,sans-serif" font-size="185" font-weight="900" font-style="italic" fill="url(#chrome)" stroke="#fff" stroke-width="3">TV</text>
 <!-- Curved title lettering -->
 <text font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="900" letter-spacing="5" fill="url(#chrome)" stroke="#1b0000" stroke-width="10" paint-order="stroke fill"><textPath href="#topArc" startOffset="5%">MAHHA</textPath></text>
</g>
</svg>